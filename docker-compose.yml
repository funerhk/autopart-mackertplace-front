version: '3.8'

services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      - NEXT_PUBLIC_AUTH_REFRESH_PATH=/auth/refresh
    depends_on:
      - backend

  backend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../autopart-marketplace-backend:/app
    ports:
      - "3000:3000"
    command: npm run start:dev
